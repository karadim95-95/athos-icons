# Checks every change: on pushes to dev, on pull requests, and before every deployment.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, release]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Translations are compiled
        run: |
          python manage.py compiletranslations
          git diff --exit-code -- locale/
      - name: Tests
        run: python manage.py test tests

  docker:
    name: Server image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag athos-shop:ci .
