# Runs when something is merged into the release branch: checks it, publishes the server image
# to GitHub's package registry, and (once a server is set up, see README) deploys it.
name: Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish the server image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=release
            type=sha,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: image
    # Skipped until the server is configured (repository variable DEPLOY_HOST, see README).
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ vars.DEPLOY_USER || 'root' }}@${{ vars.DEPLOY_HOST }}
      DIR: ${{ vars.DEPLOY_PATH || '/opt/athos-icons' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the server files
        run: scp docker-compose.yml Caddyfile "$TARGET:$DIR/"
      - name: Pull the new image and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:release"
          echo "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh "$TARGET" "cd '$DIR' \
            && (grep -q '^IMAGE=' .env || echo 'IMAGE=$IMAGE' >> .env) \
            && docker compose pull web jobs \
            && docker compose up -d --remove-orphans \
            && docker image prune -f; docker logout ghcr.io"
