{% load i18n shop %}<div class="price{% if big %} big{% endif %}">
  <strong>{{ p.final|euro }}</strong>
  {% if p.has_discount %}<s>{{ p.original|euro }}</s>{% endif %}
  {% if p.business %}<span class="vat">{% translate "excl. VAT" %}</span>{% elif big %}<span class="vat">{% translate "incl. VAT" %}</span>{% endif %}
</div>
